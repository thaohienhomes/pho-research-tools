# Publishes server.json to the official MCP Registry
# (registry.modelcontextprotocol.io). The io.github.thaohienhomes/ namespace is
# proved by this repository's GitHub OIDC token, so no secret is needed.
# Bump "version" in server.json before each re-run; a version publishes once.
name: Publish to MCP Registry

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
      - name: Check the listing
        run: curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.thaohienhomes/pho-research-tools"
