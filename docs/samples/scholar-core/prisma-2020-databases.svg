<svg xmlns="http://www.w3.org/2000/svg" width="708" height="850" viewBox="0 0 708 850" role="img" aria-labelledby="prisma-title">
<title id="prisma-title">PRISMA 2020 flow diagram</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#384240"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="'Be Vietnam Pro', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1f2624">
<rect x="70" y="24" width="614" height="46" rx="6" fill="#047857"/>
<text x="377" y="52" text-anchor="middle" font-size="14" font-weight="600" fill="#ecfdf5">Identification of new studies via databases and registers</text>
<rect x="24" y="94" width="30" height="146" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
<text x="39" y="167" transform="rotate(-90 39 167)" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#047857">Identification</text>
<rect x="24" y="280" width="30" height="302" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
<text x="39" y="431" transform="rotate(-90 39 431)" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#047857">Screening</text>
<rect x="24" y="622" width="30" height="83" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
<text x="39" y="663.5" transform="rotate(-90 39 663.5)" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#047857">Included</text>
<rect x="70" y="94" width="300" height="146" fill="#ffffff" stroke="#384240" stroke-width="1.2"/><text x="82" y="117" font-weight="600">Records identified from*:</text><text x="94" y="135">Databases (n = 2,090)</text><text x="94" y="153">– MEDLINE (PubMed) (n = 812)</text><text x="94" y="171">– Embase (n = 1,045)</text><text x="94" y="189">– Cochrane CENTRAL (n = 233)</text><text x="94" y="207">Registers (n = 41)</text>
<rect x="414" y="94" width="270" height="146" fill="#ffffff" stroke="#384240" stroke-width="1.2"/><text x="426" y="117" font-weight="600">Records removed before screening:</text><text x="438" y="135">Duplicate records removed</text><text x="438" y="153">(n = 498)</text><text x="438" y="171">Records marked as ineligible by</text><text x="438" y="189">automation tools (n = 0)</text><text x="438" y="207">Records removed for other reasons</text><text x="438" y="225">(n = 12)</text>
<rect x="70" y="280" width="300" height="38" fill="#ffffff" stroke="#384240" stroke-width="1.2"/><text x="82" y="303">Records screened (n = 1,621)</text>
<rect x="414" y="280" width="270" height="38" fill="#ffffff" stroke="#384240" stroke-width="1.2"/><text x="426" y="303">Records excluded** (n = 1,450)</text>
<rect x="70" y="358" width="300" height="38" fill="#ffffff" stroke="#384240" stroke-width="1.2"/><text x="82" y="381">Reports sought for retrieval (n = 171)</text>
<rect x="414" y="358" width="270" height="38" fill="#ffffff" stroke="#384240" stroke-width="1.2"/><text x="426" y="381">Reports not retrieved (n = 6)</text>
<rect x="70" y="436" width="300" height="146" fill="#ffffff" stroke="#384240" stroke-width="1.2"/><text x="82" y="459">Reports assessed for eligibility (n = 165)</text>
<rect x="414" y="436" width="270" height="146" fill="#ffffff" stroke="#384240" stroke-width="1.2"/><text x="426" y="459" font-weight="600">Reports excluded:</text><text x="438" y="477">Wrong population (n = 61)</text><text x="438" y="495">Wrong outcome (n = 38)</text><text x="438" y="513">Not a randomised controlled trial</text><text x="438" y="531">(n = 27)</text><text x="438" y="549">Duplicate report of an included trial</text><text x="438" y="567">(n = 9)</text>
<rect x="70" y="622" width="300" height="83" fill="#ffffff" stroke="#384240" stroke-width="1.2"/><text x="82" y="645">Studies included in review (n = 24)</text><text x="82" y="663">Reports of included studies (n = 30)</text>
<line x1="220" y1="240" x2="220" y2="278" stroke="#384240" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="370" y1="167" x2="412" y2="167" stroke="#384240" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="220" y1="318" x2="220" y2="356" stroke="#384240" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="370" y1="299" x2="412" y2="299" stroke="#384240" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="220" y1="396" x2="220" y2="434" stroke="#384240" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="370" y1="377" x2="412" y2="377" stroke="#384240" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="220" y1="582" x2="220" y2="620" stroke="#384240" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="370" y1="509" x2="412" y2="509" stroke="#384240" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="24" y="727" font-size="11" fill="#5b6764">*Consider, if feasible to do so, reporting the number of records identified from each database or register searched</text>
<text x="24" y="742" font-size="11" fill="#5b6764">(rather than the total number across all databases/registers).</text>
<text x="24" y="760" font-size="11" fill="#5b6764">**If automation tools were used, indicate how many records were excluded by a human and how many were excluded</text>
<text x="24" y="775" font-size="11" fill="#5b6764">by automation tools.</text>
<text x="24" y="793" font-size="11" fill="#5b6764">Template: Page MJ, McKenzie JE, Bossuyt PM, et al. The PRISMA 2020 statement: an updated guideline for reporting</text>
<text x="24" y="808" font-size="11" fill="#5b6764">systematic reviews. BMJ 2021;372:n71. doi:10.1136/bmj.n71. CC BY 4.0.</text>
</g>
</svg>
