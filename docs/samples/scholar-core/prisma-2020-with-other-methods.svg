<line x1="370" y1="377" x2="412" y2="377" stroke="#384240" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="220" y1="582" x2="220" y2="620" stroke="#384240" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="370" y1="509" x2="412" y2="509" stroke="#384240" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="878" y1="240" x2="878" y2="356" stroke="#384240" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="878" y1="396" x2="878" y2="434" stroke="#384240" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="1028" y1="377" x2="1070" y2="377" stroke="#384240" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="1028" y1="509" x2="1070" y2="509" stroke="#384240" stroke-width="1.4" marker-end="url(#ah)"/>
<polyline points="878,582 878,663.5 372,663.5" fill="none" stroke="#384240" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="24" y="727" font-size="11" fill="#5b6764">*Consider, if feasible to do so, reporting the number of records identified from each database or register searched (rather than the total number across all databases/registers).</text>
<text x="24" y="745" font-size="11" fill="#5b6764">**If automation tools were used, indicate how many records were excluded by a human and how many were excluded by automation tools.</text>
<text x="24" y="763" font-size="11" fill="#5b6764">Template: Page MJ, McKenzie JE, Bossuyt PM, et al. The PRISMA 2020 statement: an updated guideline for reporting systematic reviews. BMJ 2021;372:n71. doi:10.1136/bmj.n71. CC BY 4.0.</text>
</g>
